name: commerce_sql
version: '1.0.0'
config-version: 2
profile: commerce_sql
model-paths: ["models"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]
models:
  commerce_sql:
    +materialized: view
    +persist_docs: {relation: true, columns: true}
    staging:
      +schema: staging
    intermediate:
      +schema: intermediate
    marts:
      +schema: marts
      +materialized: table
