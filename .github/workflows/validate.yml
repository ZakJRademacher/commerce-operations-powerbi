name: Validate portfolio pipeline
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r dbt/requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/prepare_demo.py
      - run: python src/verify_snapshot.py
